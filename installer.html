<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c40000">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Installer le Briefing au pied de l’opération</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f0f4f7,#dce6eb);font-family:Arial,Helvetica,sans-serif;color:#16232d}
    main{width:min(100%,440px);text-align:center}
    .card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 16px 42px rgba(15,40,55,.22);border:1px solid #d7e0e5}
    .logo{width:112px;height:112px;border-radius:24px;object-fit:contain;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.14)}
    h1{margin:20px 0 10px;color:#b10000;font-size:27px;line-height:1.15}
    p{margin:0 0 18px;line-height:1.45;font-size:16px}
    .cta{display:block;border-radius:13px;padding:15px 16px;background:#28709b;color:#fff;font-size:17px;font-weight:800;box-shadow:0 5px 12px rgba(40,112,155,.28)}
    .hint{margin:17px 12px 0;color:#4c5a64;font-size:13px;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <a class="card" href="https://ghostbuilderdev.github.io/briefing-au-pied-de-l-op-ration-/?installer=1" aria-label="Ouvrir le Briefing et l’installer">
      <img class="logo" src="https://ghostbuilderdev.github.io/briefing-au-pied-de-l-op-ration-/icon-512-v19b.png" alt="Logo Briefing au pied de l’opération">
      <h1>Briefing au pied de l’opération</h1>
      <p>Ouvre l’application puis installe-la sur l’écran d’accueil.</p>
      <span class="cta">Ouvrir et installer le Briefing</span>
    </a>
    <p class="hint">Après ouverture, utilise « Installer maintenant » ou le menu ⋮ du navigateur : « Installer et créer un raccourci ».</p>
  </main>
</body>
</html>
